name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Install
        run: python -m pip install . flake8
      - name: Lint
        run: flake8 --extend-ignore E501 tabview test
      - name: Test
        # The integration tests need a terminal, so run them under a pty
        env:
          TERM: xterm
        run: script -qec "python -m unittest discover -v" /dev/null
