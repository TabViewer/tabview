[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tabview"
dynamic = ["version"]
description = "A curses command-line CSV and list (tabular data) viewer"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Scott Hansen", email = "tech@firecat53.net" }]
keywords = ["data", "spreadsheet", "view", "viewer", "console", "curses",
            "csv", "comma", "separated", "values"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Console :: Curses",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Tabviewer/tabview"
Changelog = "https://github.com/Tabviewer/tabview/blob/main/CHANGELOG.md"

[project.scripts]
tabview = "tabview.cli:main"

[tool.hatch.version]
path = "tabview/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["/tabview"]

[tool.hatch.build.targets.wheel.shared-data]
"LICENSE.txt" = "share/doc/tabview/LICENSE.txt"
"README.md" = "share/doc/tabview/README.md"
"CHANGELOG.md" = "share/doc/tabview/CHANGELOG.md"

# README.md, LICENSE.txt and pyproject.toml are always included. The tests
# and the sample data they read are included so they can run from the sdist.
[tool.hatch.build.targets.sdist]
include = [
    "/tabview",
    "/test",
    "/sample",
    "/CHANGELOG.md",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "UP"]
# Long lines are allowed (help text, test data)
ignore = ["E501"]
